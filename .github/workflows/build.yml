# Builds the plugin and runs the tests on every push and pull request.
# Actions are pinned to full commit SHAs (required by the organization policy).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  KEEPASS_VERSION: '2.60'
  KEEPASS_SHA256: '63872830ae78a0e9075cd32b61693ce1e719929b3124e4987b1f3dc42f31da74'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The KeePass.exe reference comes from the official KeePass ZIP, verified by SHA-256
      # (hash published at https://keepass.info/integrity.html).
      - name: Download and verify KeePass (build reference only)
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\KeePass.zip"
          $url = "https://sourceforge.net/projects/keepass/files/KeePass%202.x/$env:KEEPASS_VERSION/KeePass-$env:KEEPASS_VERSION.zip/download"
          curl.exe -sSL --fail --retry 3 -o $zip $url
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:KEEPASS_SHA256) { throw "KeePass ZIP hash mismatch: $hash" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\KeePass"
          "KEEPASS_DIR=$env:RUNNER_TEMP\KeePass\" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: dotnet build src/RamzXOtp/RamzXOtp.csproj -c Release "/p:KeePassDir=$env:KEEPASS_DIR"

      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/RamzXOtp.Tests/RamzXOtp.Tests.csproj -c Release
          "/p:KeePassDir=$env:KEEPASS_DIR"
          --collect:"XPlat Code Coverage" --results-directory "$env:RUNNER_TEMP/coverage"

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: ./build/coverage-summary.ps1 "$env:RUNNER_TEMP/coverage" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RamzXOtp
          path: |
            src/RamzXOtp/bin/Release/net48/RamzXOtp.dll
            LICENSE
            README.md
          if-no-files-found: error
