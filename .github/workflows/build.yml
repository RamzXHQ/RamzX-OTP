# Builds the plugin and runs the tests on every push and pull request.
# Actions are pinned to full commit SHAs (required by the organization policy).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build src/RamzXOtp/RamzXOtp.csproj -c Release

      - name: Test
        shell: pwsh
        run: >
          dotnet test tests/RamzXOtp.Tests/RamzXOtp.Tests.csproj -c Release
          --collect:"XPlat Code Coverage" --results-directory "$env:RUNNER_TEMP/coverage"

      - name: Coverage summary
        if: always()
        shell: pwsh
        run: ./build/coverage-summary.ps1 "$env:RUNNER_TEMP/coverage" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload plugin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RamzXOtp
          path: |
            src/RamzXOtp/bin/Release/net48/RamzXOtp.dll
            LICENSE
            README.md
          if-no-files-found: error
